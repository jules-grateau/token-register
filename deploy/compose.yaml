# VPS stack: Traefik + token-register production + token-register test.
# Lives on the VPS next to: .env, .env.prod, .env.test and traefik/acme.json (see deploy/README.md).
# The CI only runs `docker compose pull/up <service>` here; it never edits this file.

services:
  traefik:
    user: root
    image: traefik:v3
    container_name: traefik
    command:
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'

      - '--entrypoints.web.address=:80'
      - '--entrypoints.websecure.address=:443'

      # Let's Encrypt
      - '--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}'
      - '--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json'
      - '--certificatesresolvers.letsencrypt.acme.httpchallenge=true'
      - '--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
      - './traefik/acme.json:/letsencrypt/acme.json'
    restart: unless-stopped
    networks:
      - token-register-network

  # --- Production (deployed on merge to main) ---
  token-register:
    image: ghcr.io/jules-grateau/token-register:${PROD_TAG:-prod}
    container_name: token-register-app
    env_file: .env.prod
    volumes:
      - token-register-db:/data
    restart: unless-stopped
    networks:
      - token-register-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.token-register.rule=Host(`${PROD_HOST}`)'
      - 'traefik.http.routers.token-register.entrypoints=websecure'
      - 'traefik.http.routers.token-register.tls=true'
      - 'traefik.http.routers.token-register.tls.certresolver=letsencrypt'
      - 'traefik.http.services.token-register.loadbalancer.server.port=3000'
    expose:
      - 3000

  # --- Test (deployed on merge to develop) — separate container, DB and credentials ---
  token-register-test:
    image: ghcr.io/jules-grateau/token-register:${TEST_TAG:-test}
    container_name: token-register-test
    env_file: .env.test
    volumes:
      - token-register-test-db:/data
    restart: unless-stopped
    networks:
      - token-register-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.token-register-test.rule=Host(`${TEST_HOST}`)'
      - 'traefik.http.routers.token-register-test.entrypoints=websecure'
      - 'traefik.http.routers.token-register-test.tls=true'
      - 'traefik.http.routers.token-register-test.tls.certresolver=letsencrypt'
      - 'traefik.http.services.token-register-test.loadbalancer.server.port=3000'
    expose:
      - 3000

volumes:
  # Same name as the existing production volume: the prod data is kept.
  token-register-db:
    driver: local
  token-register-test-db:
    driver: local

networks:
  token-register-network:
    driver: bridge
