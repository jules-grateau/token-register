name: Release smoke check

# Free smoke check on release PRs (develop -> main), no AI (D-038). The visual design
# review is done once, by the designer agent, on the feature PR, targeted on the screens
# that PR changes. Here we only check that the real demos (tokens, then EUR) still work:
#   1. capture - wait for the demo deploy of the PR's commit, drive each demo with
#                Playwright (desktop / tablet / mobile / mobile landscape), then
#                scripts/design-review/check-report.mjs fails on any failed step,
#                console/JS error or horizontal overflow. Screenshots are kept as a
#                workflow artifact, token demo only (not published, not reviewed).
#   + failure  - if anything fails, say so on the PR, with the problem list
#                (smoke-problems.md, written by check-report.mjs) when there is one.
# Skipped entirely when no app file changed (scripts/ci/app-changed.sh).
#
# Secrets: DEMO_BASIC_AUTH_USER / DEMO_BASIC_AUTH_PASS (token demo Basic Auth),
#          DEMO_EUR_URL / DEMO_EUR_BASIC_AUTH_USER / DEMO_EUR_BASIC_AUTH_PASS (EUR demo, D-059).
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DEMO_URL: https://demo.julesgrateau.dev

jobs:
  # Skip the whole review when the release PR, taken as a whole, doesn't touch the app.
  # Always the whole PR (base...head), never only the new commits: a newer run cancels
  # the one in progress (concurrency), so it must cover everything the cancelled one did.
  changes:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Did this change touch the app?
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          range="$BASE...$HEAD"
          app=$(bash scripts/ci/app-changed.sh "$range")
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "### App changed: \`$app\` (range \`$range\`)" >> "$GITHUB_STEP_SUMMARY"

  capture:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    # Pinned: Playwright 1.55 does not support ubuntu-latest (26.04). Bump both together.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      # The demo must run the PR's commit, otherwise we'd review an old version.
      - name: Wait for the demo deploy of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for i in $(seq 1 40); do
            run=$(gh run list --workflow ci-cd.yml --commit "$HEAD_SHA" --event push --limit 1 \
              --json status,conclusion,url -q '.[0] | "\(.status) \(.conclusion) \(.url)"')
            echo "CI/CD run for $HEAD_SHA: ${run:-not found yet}"
            case "$run" in
              "completed success "*) exit 0 ;;
              completed*) echo "::error::Demo deploy of $HEAD_SHA did not succeed: $run"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::Timed out waiting for the demo deploy of $HEAD_SHA"; exit 1

      # Only Playwright is needed (no app build): install it apart from the repo.
      - name: Install Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
          cp "$GITHUB_WORKSPACE/scripts/design-review/capture.mjs" .

      # check-report.mjs writes smoke-problems.md in the current folder: one folder per demo,
      # each problem prefixed with its demo, gathered below for the PR comment.
      - name: Capture and check the token demo
        env:
          APP_URL: ${{ env.DEMO_URL }}
          BASIC_AUTH_USER: ${{ secrets.DEMO_BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ secrets.DEMO_BASIC_AUTH_PASS }}
          OUT_DIR: ${{ github.workspace }}/design-review-output/jetons
        run: |
          if [ -z "$BASIC_AUTH_USER" ] || [ -z "$BASIC_AUTH_PASS" ]; then
            echo "::error::DEMO_BASIC_AUTH_USER / DEMO_BASIC_AUTH_PASS secrets are not set"; exit 1
          fi
          mkdir -p "$OUT_DIR"
          status=0
          (cd "$RUNNER_TEMP/pw" && node capture.mjs) || status=$?
          if [ "$status" -ne 0 ]; then
            echo "- démo jetons : la capture s'est arrêtée" > "$OUT_DIR/smoke-problems.md"; exit 1
          fi
          cd "$OUT_DIR"
          node "$GITHUB_WORKSPACE/scripts/design-review/check-report.mjs" report.json || status=$?
          if [ -s smoke-problems.md ]; then sed -i 's/^- /- démo jetons : /' smoke-problems.md; fi
          exit $status

      # The EUR demo (D-059). Its URL is a secret and the instance may show an association
      # name: its screenshots and report.json are not uploaded (the artifacts of this public
      # repository can be downloaded), and the URL is masked in the summary and problem list.
      - name: Capture and check the EUR demo
        if: ${{ !cancelled() }}
        env:
          APP_URL: ${{ secrets.DEMO_EUR_URL }}
          BASIC_AUTH_USER: ${{ secrets.DEMO_EUR_BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ secrets.DEMO_EUR_BASIC_AUTH_PASS }}
          OUT_DIR: ${{ runner.temp }}/smoke-eur
        run: |
          if [ -z "$APP_URL" ] || [ -z "$BASIC_AUTH_USER" ] || [ -z "$BASIC_AUTH_PASS" ]; then
            echo "::error::DEMO_EUR_URL / DEMO_EUR_BASIC_AUTH_USER / DEMO_EUR_BASIC_AUTH_PASS secrets are not set"; exit 1
          fi
          problems="$GITHUB_WORKSPACE/design-review-output/eur/smoke-problems.md"
          mkdir -p "$OUT_DIR" "$(dirname "$problems")"
          status=0
          (cd "$RUNNER_TEMP/pw" && node capture.mjs > "$OUT_DIR/capture.log" 2>&1) || status=$?
          if [ "$status" -ne 0 ]; then
            echo "- démo EUR : la capture s'est arrêtée" > "$problems"; exit 1
          fi
          url=${APP_URL%/}
          mask() { local text; text=$(cat "$1"); printf '%s\n' "${text//"$url"/<démo EUR>}"; }
          cd "$OUT_DIR"
          GITHUB_STEP_SUMMARY="" node "$GITHUB_WORKSPACE/scripts/design-review/check-report.mjs" report.json \
            > summary.md || status=$?
          sed -i 's/^### Release smoke check/### Release smoke check, démo EUR/' summary.md
          mask summary.md | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -s smoke-problems.md ]; then mask smoke-problems.md | sed 's/^- /- démo EUR : /' > "$problems"; fi
          exit $status

      - name: Gather the problem list
        if: failure()
        run: cat design-review-output/*/smoke-problems.md > smoke-problems.md 2> /dev/null || true

      # Token demo only (see the EUR step).
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: design-review-screenshots
          path: design-review-output/jetons
          if-no-files-found: warn

      # Written by check-report.mjs only when it finds problems; posted by the failure job.
      - name: Upload the problem list
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-problems
          path: smoke-problems.md
          if-no-files-found: ignore

  # The release is not validated if the smoke check failed: say it on the PR, with the
  # problem list from check-report.mjs when the run got that far.
  failure:
    needs: [changes, capture]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # Absent when the run failed before the check (deploy not found, capture crash).
      - name: Download the problem list
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: smoke-problems

      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "🧪 **Contrôle automatique de la release : ❌ échec.**"
            echo
            if [ -s smoke-problems.md ]; then
              echo "Problèmes détectés sur les démos :"
              echo
              # Capped: a run where every step fails would exceed the comment size limit.
              head -n 50 smoke-problems.md
              total=$(grep -c '^- ' smoke-problems.md || true)
              if [ "$total" -gt 50 ]; then
                echo "- … et $((total - 50)) autre(s) : voir le résumé du run."
              fi
              echo
              echo "Résumé et captures (artifact) : $RUN_URL"
            else
              echo "Les démos n'ont pas pu être déployées ou jointes, ou la capture s'est arrêtée avant le contrôle. Détails : $RUN_URL"
            fi
            echo
            echo "Corriger puis pousser sur \`develop\` relance la revue."
          } > comment.md
          gh pr comment "$PR" --repo "$REPO" --body-file comment.md
