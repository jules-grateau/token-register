name: CI/CD

# - Pull requests to develop/main: tests only.
# - Push (= merge) to develop: tests -> image :test   -> redeploy the demo instances (tokens + EUR).
# - Push (= merge) to main:    tests -> image :latest -> redeploy production instances
#   (after manual approval, configured on the "production" GitHub environment).
# All of it is skipped when the change can't affect the app (agent prompts, docs,
# markdown, review-only workflows: see scripts/ci/app-changed.sh). The run still
# exists and succeeds, which design-review.yml relies on.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a deployment halfway; only cancel superseded PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: only the release job can write (tags + GitHub Releases).
permissions:
  contents: read

env:
  IMAGE: julesgrateau/token-register

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test the change detection script
        run: bash scripts/ci/app-changed.test.sh
      - name: Did this change touch the app?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE...$HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$BEFORE..$GITHUB_SHA"
          else
            range=""  # first push of a branch: unknown, the script answers "true"
          fi
          app=$(bash scripts/ci/app-changed.sh "$range")
          echo "app=$app" >> "$GITHUB_OUTPUT"
          {
            echo "### App changed: \`$app\`"
            echo "Range: \`${range:-unknown}\`"
            if [ "$app" = "false" ]; then
              echo "Tests, image build and deploy are skipped (no app file touched)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Every production release must bump the version (README > Versioning). Only when the
  # app changed: otherwise nothing is deployed nor released.
  version-check:
    needs: changes
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test the version check script
        run: bash scripts/ci/version-bumped.test.sh
      - name: Was the version bumped compared to main?
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=$(git show "$BASE:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          head=$(node -p "require('./package.json').version")
          if ! bash scripts/ci/version-bumped.sh "$base" "$head"; then
            echo "::error::Bump the version before releasing to main (main: $base, this PR: $head). See README > Versioning."
            exit 1
          fi

  test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -w=api
      - run: npm test -w=client
      - run: npm run build

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image tag from branch
        id: target
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"; echo "channel=production" >> "$GITHUB_OUTPUT"
          else
            echo "tag=test" >> "$GITHUB_OUTPUT"; echo "channel=demo" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the app version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing release
        if: github.ref_name == 'main'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::v$VERSION is already released: bump the version (README > Versioning)."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # :latest / :test is what the VPS runs; :sha-xxxxxxx and :<version> (main only)
          # allow rollbacks.
          tags: |
            type=raw,value=${{ steps.target.outputs.tag }}
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref_name == 'main' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            RELEASE_CHANNEL=${{ steps.target.outputs.channel }}
          cache-from: type=gha,scope=${{ steps.target.outputs.tag }}
          cache-to: type=gha,mode=max,scope=${{ steps.target.outputs.tag }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Add "Required reviewers" on the "production" environment (repo settings) so prod
    # instances are only restarted when you approve — never in the middle of an event.
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'test' }}
      # No URL for production: environment URLs are public on this repository.
      url: ${{ github.ref_name != 'main' && 'https://demo.julesgrateau.dev' || '' }}
    steps:
      # Production services come from the PROD_SERVICES repository secret (masked in the logs),
      # so the production setup is not written in this public repository.
      - name: Check the production secret
        if: github.ref_name == 'main'
        env:
          PROD_SERVICES: ${{ secrets.PROD_SERVICES }}
        run: |
          if [ -z "$(printf '%s' "$PROD_SERVICES" | tr -d '[:space:]')" ]; then
            echo "::error::Repository secret PROD_SERVICES is empty (space-separated compose services): nothing would be restarted."
            exit 1
          fi

      # The EUR demo (D-059) runs next to the token demo, on the same :test image. Its compose
      # service, URL and Basic Auth come from secrets: nothing about it is written here.
      - name: Check the EUR demo secrets
        if: github.ref_name != 'main'
        env:
          DEMO_EUR_SERVICE: ${{ secrets.DEMO_EUR_SERVICE }}
          DEMO_EUR_URL: ${{ secrets.DEMO_EUR_URL }}
          DEMO_EUR_BASIC_AUTH_USER: ${{ secrets.DEMO_EUR_BASIC_AUTH_USER }}
          DEMO_EUR_BASIC_AUTH_PASS: ${{ secrets.DEMO_EUR_BASIC_AUTH_PASS }}
        run: |
          missing=""
          for var in DEMO_EUR_SERVICE DEMO_EUR_URL DEMO_EUR_BASIC_AUTH_USER DEMO_EUR_BASIC_AUTH_PASS; do
            [ -z "$(printf '%s' "${!var}" | tr -d '[:space:]')" ] && missing="$missing $var"
          done
          if [ -n "$missing" ]; then
            echo "::error::Repository secret(s) not set:$missing (EUR demo, see deploy/README.md)."
            exit 1
          fi

      - name: Pull and restart the services on the VPS
        # Pinned to a commit (not a movable tag): this third-party action receives the SSH key.
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          # Compose services of the VPS compose.yaml running this image tag.
          # Production: repository secret PROD_SERVICES (space-separated), checked above.
          # Demo: the token demo and the EUR demo (secret DEMO_EUR_SERVICE, checked above).
          SERVICES: ${{ github.ref_name == 'main' && secrets.PROD_SERVICES || format('token-register {0}', secrets.DEMO_EUR_SERVICE) }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: SERVICES,DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"

            # Never print service or container names: Actions logs are public on this repo, and
            # the secret is only masked as a whole, not name by name. Read the output on the VPS.
            if ! docker compose pull --quiet $SERVICES > /dev/null 2>&1; then
              echo "::error::docker compose pull failed. On the VPS: docker compose pull"
              exit 1
            fi
            # --no-deps: only restart these services, never Traefik or the other projects.
            if ! docker compose up -d --no-deps $SERVICES > /dev/null 2>&1; then
              echo "::error::docker compose up failed. On the VPS: docker compose up -d --no-deps <service>"
              exit 1
            fi

            # The entrypoint runs DB init + migrations: a failure makes the container exit/restart.
            sleep 20
            FAILED=0
            INDEX=0
            for SERVICE in $SERVICES; do
              INDEX=$((INDEX + 1))
              CONTAINER=$(docker compose ps -q "$SERVICE" 2>/dev/null || true)
              STATE=$(docker inspect -f '{{.State.Status}}' "$CONTAINER" 2>/dev/null || echo missing)
              RESTARTS=$(docker inspect -f '{{.RestartCount}}' "$CONTAINER" 2>/dev/null || echo unknown)
              if [ "$STATE" != "running" ] || [ "$RESTARTS" != "0" ]; then
                # Do not print container logs here: Actions logs are public on this repo and
                # request logs contain Basic Auth headers. Read them on the VPS instead.
                echo "::error::Service #$INDEX failed: state=$STATE restarts=$RESTARTS. On the VPS: docker compose logs --tail=100 <service>"
                FAILED=1
              else
                echo "Service #$INDEX is running."
              fi
            done

            docker image prune -f > /dev/null
            exit $FAILED

      # D-059: the EUR demo gets a demo catalog when it has none at all. Never modifies what
      # exists (D-055); the token demo is not touched. A failure fails the deploy.
      - uses: actions/checkout@v7
        if: github.ref_name != 'main'
      - name: Fill the EUR demo catalog if it is empty
        if: github.ref_name != 'main'
        env:
          APP_URL: ${{ secrets.DEMO_EUR_URL }}
          BASIC_AUTH_USER: ${{ secrets.DEMO_EUR_BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ secrets.DEMO_EUR_BASIC_AUTH_PASS }}
        run: node scripts/demo/seed-eur-catalog.mjs

  # Production only, once the deploy succeeded: git tag v<version> + GitHub Release with
  # notes generated from the merged PRs.
  release:
    needs: [build, deploy]
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the tag and the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Tag v$VERSION already exists: bump the version (README > Versioning)."
            exit 1
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
